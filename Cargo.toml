[package]
name = "mdv"
version = "0.1.0"
edition = "2024"
description = "A graphical Markdown viewer for modern terminals"
license = "Apache-2.0"
repository = "https://github.com/ramitamir/mdv"
keywords = ["markdown", "terminal", "viewer", "kitty", "graphics"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
cosmic-text = "0.18.2"
crossterm = "0.29.0"
dirs = "6"
image = "0.25.10"
pulldown-cmark = "0.13.3"
ratatui = "0.30.0"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
syntect = "5.3.0"
toml = "0.8"

# Optimize dependencies even in debug mode for acceptable performance
[profile.dev.package."*"]
opt-level = 2
